<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار تحديد المستوى | القدرات العامة، القسم الكمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#EEF2F0;
  --surface:#FFFFFF;
  --ink:#16302B;
  --muted:#5B6E69;
  --line:#D3DDD9;
  --accent:#0E6B5A;
  --accent-ink:#FFFFFF;
  --accent-soft:#DCEFEA;
  --sure:#0E6B5A;
  --unsure:#9A5F08;
  --unsure-soft:#F6EBD6;
  --guess:#A2414B;
  --guess-soft:#F5E1E3;
  --over:#9A5F08;
  --backdrop:rgba(10,20,18,.45);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#0F1715;
    --surface:#16211E;
    --ink:#E3ECE9;
    --muted:#9AADA8;
    --line:#2A3A36;
    --accent:#4CC0A6;
    --accent-ink:#06231D;
    --accent-soft:#183A33;
    --sure:#4CC0A6;
    --unsure:#E3A94A;
    --unsure-soft:#3A2E17;
    --guess:#E8848F;
    --guess-soft:#3B1E22;
    --over:#E3A94A;
    --backdrop:rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,'Geeza Pro',sans-serif;font-size:17px;line-height:1.7}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:.7rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.where{display:flex;flex-direction:column;line-height:1.35}
.where strong{font-weight:600;font-size:1rem}
.where span{color:var(--muted);font-size:.875rem}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;font-variant-numeric:tabular-nums}
.clock span{font-size:1.35rem;font-weight:600}
.clock small{color:var(--muted);font-size:.8rem}
.clock.over span{color:var(--over)}

/* Page */
main{max-width:760px;margin:0 auto;padding:1.25rem 1.25rem 2rem}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.75rem 1.5rem}
h1{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:2rem;line-height:1.45;margin:0 0 .75rem}
.lede{font-size:1.1rem;margin:0 0 1.25rem;max-width:60ch}
.rules{margin:0 0 1.75rem;padding-inline-start:1.25rem;max-width:62ch}
.rules li{margin:.35rem 0}
.actions{display:flex;flex-wrap:wrap;gap:.75rem}
.primary,.ghost{border-radius:999px;padding:.65rem 1.5rem;font-weight:600;cursor:pointer;border:1.5px solid var(--accent);min-height:48px}
.primary{background:var(--accent);color:var(--accent-ink)}
.ghost{background:transparent;color:var(--accent)}
.primary:disabled,.ghost:disabled{opacity:.4;cursor:not-allowed}
.step{color:var(--muted);margin:0 0 .25rem;font-weight:500}
.secintro p{max-width:60ch}
.cmpkey{list-style:none;padding:0;margin:0 0 1.5rem;display:grid;gap:.45rem}
.cmpkey b{display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--accent-soft);color:var(--accent);margin-inline-end:.6rem}

/* Question navigator */
.strip{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1rem}
.cell{width:2.5rem;height:2.5rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer;font-weight:500}
.cell.done{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.cell.current{border:2px solid var(--accent);color:var(--ink);font-weight:700}
.cell:disabled{opacity:.4;cursor:default}

/* Question */
.qnum{font-family:'Noto Naskh Arabic',serif;font-size:3.25rem;line-height:1;color:var(--accent);font-weight:700;margin:0 0 .6rem;font-variant-numeric:tabular-nums}
.qtext{font-family:'Noto Naskh Arabic',serif;font-size:1.32rem;line-height:2;margin:0 0 1.25rem;max-width:62ch}
.qtext:focus{outline:none}
.tablewrap{overflow-x:auto;margin:0 0 1rem}
table.data{border-collapse:collapse;min-width:280px;font-size:1rem}
table.data caption{text-align:start;color:var(--muted);font-size:.9rem;padding-bottom:.4rem}
table.data th,table.data td{border:1px solid var(--line);padding:.45rem .9rem;text-align:start}
table.data th{background:var(--bg);font-weight:600}
table.data td:last-child{font-variant-numeric:tabular-nums}
.cmp{margin:0 0 1.25rem}
.given{margin:0 0 .75rem;font-size:1.1rem}
.given span{color:var(--muted)}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.cmpgrid div{border:1px dashed var(--line);border-radius:10px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.3rem}
.cmpgrid span{color:var(--muted);font-size:.875rem}
.cmpgrid b{font-family:'Noto Naskh Arabic',serif;font-size:1.35rem;font-weight:600}

.choices{display:grid;gap:.6rem;margin:0 0 1.5rem}
.choice{display:grid;grid-template-columns:2.4rem 1fr;align-items:center;gap:.75rem;text-align:start;padding:.6rem .9rem;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;min-height:56px;font-size:1.1rem}
.choice .let{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-weight:600;color:var(--muted)}
.choice:hover{border-color:var(--accent)}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.choice.on .let{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.conf{border-top:1px solid var(--line);padding-top:1.1rem;margin:0 0 1rem}
.conf p{margin:0 0 .6rem;font-weight:600}
.cfrow{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.cf{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.45rem;min-height:48px;font-weight:500}
.cf .mk{font-weight:700}
.cf-sure.on{border-color:var(--sure);background:var(--accent-soft);color:var(--sure)}
.cf-unsure.on{border-color:var(--unsure);background:var(--unsure-soft);color:var(--unsure)}
.cf-guess.on{border-color:var(--guess);background:var(--guess-soft);color:var(--guess)}

.note summary{cursor:pointer;color:var(--muted);font-size:.95rem;padding:.25rem 0}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin:.6rem 0}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:.35rem .85rem;font-size:.9rem;cursor:pointer}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.note textarea,.raw textarea{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;resize:vertical}

.qnav{position:sticky;bottom:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.9rem 0 1rem;margin-top:.5rem}
.hint{margin:0;color:var(--muted);font-size:.875rem;text-align:center;flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Finish */
.done p{max-width:60ch}
.status{min-height:1.6em;color:var(--accent);font-weight:500;margin:.9rem 0 .5rem}
.raw summary{cursor:pointer;color:var(--muted)}
.raw textarea{margin-top:.6rem;font-size:.9rem}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:1.5rem;width:min(440px,92vw)}
dialog::backdrop{background:var(--backdrop)}
dialog h2{font-family:'Noto Naskh Arabic',serif;margin:0 0 .5rem;font-size:1.4rem}
dialog p{margin:0 0 1.25rem}

@media (max-width:520px){
  body{font-size:16px}
  main{padding:1rem .75rem 1.5rem}
  .sheet{padding:1.25rem 1rem;border-radius:12px}
  .qtext{font-size:1.2rem}
  .qnum{font-size:2.6rem}
  .cmpgrid{grid-template-columns:1fr}
  .cf{font-size:.95rem}
  .cell{width:2.3rem;height:2.3rem}
}
@media (prefers-reduced-motion:no-preference){
  .choice,.cf,.chip,.cell{transition:background-color .12s,border-color .12s}
}
</style>
</head>

    </div>
  </form>
</dialog>

Q.forEach(function(q){ byN[q.n] = q; });

/* ---------- State ---------- */
var store = {
  get: function(){ try { var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch(e){ return null; } },
  set: function(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} },
  clear: function(){ try { localStorage.removeItem(KEY); } catch(e){} }
};
if (/[?&]reset\b/.test(location.search)) {
  store.clear();
  try { history.replaceState(null, '', location.pathname); } catch(e){}
}
function fresh(){
  return {v:1, screen:'welcome', sec:0, cur:1, reached:[0,0,0,0], ans:{}, secTime:[0,0,0,0], qTime:{}, startedAt:null, finishedAt:null};
}
var S = store.get();

function save(){ store.set(S); }
function A(n){ if (!S.ans[n]) S.ans[n] = {c:null, f:null, note:''}; return S.ans[n]; }
function complete(n){ var a = S.ans[n]; return !!(a && a.c !== null && a.f !== null); }
function p2(x){ return (x < 10 ? '0' : '') + x; }
function fmt(ms){ var t = Math.round(ms/1000); return Math.floor(t/60) + ':' + p2(t % 60); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function noteParts(note){ return note.split('،').map(function(x){ return x.trim(); }).filter(Boolean); }

function renderHeader(){

function renderQuestion(){
  var sec = SECTIONS[S.sec], q = byN[S.cur], a = A(S.cur);
  var n, strip = '';
  for (n = sec.from; n <= sec.to; n++) {
    var locked = n > S.reached[S.sec];
    var cls = 'cell' + (n === S.cur ? ' current' : '') + (complete(n) ? ' done' : '');
    strip += '<button class="' + cls + '" data-action="go" data-n="' + n + '"' + (locked ? ' disabled' : '') +
      ' aria-label="السؤال ' + n + (complete(n) ? '، تمت الإجابة' : '') + '"' + (n === S.cur ? ' aria-current="step"' : '') + '>' + n + '</button>';
  }

  var body = '';
  if (q.table) body += '<div class="tablewrap">' + SALES_TABLE + '</div>';
  if (q.cmp) {
    body += '<p class="qtext" id="qtext" tabindex="-1">قارني بين القيمة الأولى والقيمة الثانية.</p>';
    body += '<div class="cmp">' + (q.cmp.given ? '<p class="given"><span>المعطيات: </span>' + q.cmp.given + '</p>' : '') +
      '<div class="cmpgrid"><div><span>القيمة الأولى</span><b>' + q.cmp.a + '</b></div><div><span>القيمة الثانية</span><b>' + q.cmp.b + '</b></div></div></div>';
  } else {
    body += '<p class="qtext" id="qtext" tabindex="-1">' + q.text + '</p>';
  }

  var opts = q.cmp ? CMP_CHOICES : q.choices;
  var choices = opts.map(function(c, i){
    var on = a.c === i;
    return '<button class="choice' + (on ? ' on' : '') + '" role="radio" aria-checked="' + on + '" data-action="choose" data-i="' + i + '">' +
      '<span class="let">' + LETTERS[i] + '</span><span class="ct">' + c + '</span></button>';
  }).join('');

  var conf = CONF.map(function(c){
    var on = a.f === c.id;
    return '<button class="cf cf-' + c.id + (on ? ' on' : '') + '" role="radio" aria-checked="' + on + '" data-action="conf" data-f="' + c.id + '">' +
      '<span class="mk" aria-hidden="true">' + c.mark + '</span>' + c.label + '</button>';
  }).join('');

  var parts = noteParts(a.note);
  var chips = NOTE_CHIPS.map(function(t){
    var on = parts.indexOf(t) !== -1;
    return '<button class="chip' + (on ? ' on' : '') + '" data-action="chip" data-t="' + esc(t) + '" aria-pressed="' + on + '">' + t + '</button>';
  }).join('');
  var open = a.note || ui.noteOpen[S.cur];

  var ok = complete(S.cur);
  var lastInSec = S.cur === sec.to;
  var lastSec = S.sec === SECTIONS.length - 1;
  var nextLabel = lastInSec ? (lastSec ? 'إنهاء الاختبار' : 'إنهاء القسم') : 'التالي';

  return '<nav class="strip" aria-label="أسئلة القسم">' + strip + '</nav>' +
    '<article class="sheet q">' +
      '<div class="qnum" aria-hidden="true">' + q.n + '</div>' + body +
      '<div class="choices" role="radiogroup" aria-label="الخيارات">' + choices + '</div>' +
      '<div class="conf"><p id="confLbl">كم أنتِ متأكدة من إجابتك؟</p><div class="cfrow" role="radiogroup" aria-labelledby="confLbl">' + conf + '</div></div>' +
      '<details class="note"' + (open ? ' open' : '') + '><summary>واجهتِ صعوبة في هذا السؤال؟ أضيفي ملاحظة</summary>' +
        '<div class="chips">' + chips + '</div>' +
        '<label class="sr" for="note">ملاحظة عن السؤال</label>' +
        '<textarea id="note" rows="2" placeholder="اكتبي بكلماتك ما الذي أوقفك (اختياري)">' + esc(a.note) + '</textarea>' +
      '</details>' +
    '</article>' +
    '<div class="qnav">' +
      '<button class="ghost" data-action="prev"' + (S.cur === sec.from ? ' disabled' : '') + '>السابق</button>' +
      '<p class="hint" aria-live="polite">' + (ok ? '' : 'اختاري إجابة ومدى ثقتك للمتابعة') + '</p>' +
      '<button class="primary" data-action="next"' + (ok ? '' : ' disabled') + '>' + nextLabel + '</button>' +
    '</div>';
}

function renderDone(){

  return '<section class="sheet done">' +

function render(){
  renderHeader();
  var html;
  if (resumePrompt || S.screen === 'welcome') html = renderWelcome();
  else if (S.screen === 'secIntro') html = renderSecIntro();
  else if (S.screen === 'question') html = renderQuestion();
  else html = renderDone();
  app.innerHTML = html;
  if (inQuestion()) {
    if (ui.lastQ !== S.cur) {
      ui.lastQ = S.cur;
      window.scrollTo(0, 0);
      var t = document.getElementById('qtext');
      if (t) t.focus({preventScroll:true});
    }

    ui.lastQ = null;
  }
}
function refocus(sel){ var el = app.querySelector(sel); if (el) el.focus(); }

/* ---------- Report ---------- */
function isRight(q){ var a = S.ans[q.n]; return !!(a && a.c === q.ans); }

function report(){
  var L = [];
  var d = new Date(S.finishedAt || Date.now());
  var stamp = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  var score = Q.filter(isRight).length;
  var total = S.secTime.reduce(function(x, y){ return x + y; }, 0);

  L.push('نتيجة اختبار تحديد المستوى: القدرات العامة، القسم الكمي');
  L.push('تاريخ الإنهاء: ' + stamp);
  L.push('');
  L.push('الدرجة: ' + score + ' من ' + Q.length);
  L.push('الوقت الكلي: ' + fmt(total));
  L.push('');
  L.push('الأقسام:');
  SECTIONS.forEach(function(s, i){
    var c = 0;
    for (var n = s.from; n <= s.to; n++) if (isRight(byN[n])) c++;
    L.push('- ' + s.title + ': ' + c + ' من ' + (s.to - s.from + 1) + '، الوقت ' + fmt(S.secTime[i]) + ' (المقترح ' + fmt(s.suggested * 1000) + ')');
  });
  L.push('');

  var m = {sure:[0,0], unsure:[0,0], guess:[0,0]}, wrongSure = [], rightGuess = [];
  Q.forEach(function(q){
    var a = S.ans[q.n];
    if (!a || !a.f) return;
    var r = isRight(q);
    m[a.f][r ? 0 : 1]++;
    if (!r && a.f === 'sure') wrongSure.push('س' + q.n);
    if (r && a.f === 'guess') rightGuess.push('س' + q.n);
  });
  L.push('الثقة مقابل الصحة:');
  CONF.forEach(function(c){ L.push('- ' + c.label + ': ' + m[c.id][0] + ' صحيحة، ' + m[c.id][1] + ' خاطئة'); });
  L.push('- خاطئة مع ثقة (فهم خاطئ محتمل): ' + (wrongSure.join('، ') || 'لا يوجد'));
  L.push('- صحيحة بالتخمين (معرفة غير ثابتة): ' + (rightGuess.join('، ') || 'لا يوجد'));
  L.push('');

  var sk = {}, order = [];
  Q.forEach(function(q){
    if (!sk[q.skill]) { sk[q.skill] = {r:0, t:0, ns:[]}; order.push(q.skill); }
    sk[q.skill].t++;
    sk[q.skill].ns.push('س' + q.n);
    if (isRight(q)) sk[q.skill].r++;
  });
  order.sort(function(x, y){ return (sk[x].r / sk[x].t) - (sk[y].r / sk[y].t); });
  L.push('حسب المهارة (الأضعف أولاً):');
  order.forEach(function(k){ L.push('- ' + k + ': ' + sk[k].r + ' من ' + sk[k].t + ' (' + sk[k].ns.join('، ') + ')'); });
  L.push('');

  L.push('تفصيل الأسئلة:');
  Q.forEach(function(q){
    var a = S.ans[q.n] || {c:null, f:null, note:''};
    var r = isRight(q);
    var pick = a.c === null ? 'بلا إجابة' : (r ? LETTERS[a.c] : LETTERS[a.c] + ' (الصحيح ' + LETTERS[q.ans] + ')');
    var cf = '';
    CONF.forEach(function(c){ if (c.id === a.f) cf = c.label; });
    var topic = q.cmp ? 'المقارنة: ' + q.sub : q.skill;
    L.push('س' + q.n + ' | ' + topic + ' | ' + pick + ' | ' + (r ? 'صحيحة' : 'خاطئة') + ' | ' + (cf || 'بلا ثقة') + ' | ' + fmt(S.qTime[q.n] || 0));
    if (!r && a.c !== null && q.diag && q.diag[a.c]) L.push('    خطأ محتمل: ' + q.diag[a.c]);
    if (a.note && a.note.trim()) L.push('    ملاحظتها: ' + a.note.trim());
  });
  return L.join('\n');
}

/* ---------- Actions ---------- */
function status(msg){ var el = document.getElementById('status'); if (el) el.textContent = msg; }

function copyText(text){
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(function(){ return true; }, function(){ return legacyCopy(text); });
  }
  return Promise.resolve(legacyCopy(text));
}
function legacyCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e){}
  ta.remove();
  return ok;
}

function openEnd(){
  var s = SECTIONS[S.sec];
  var isLast = S.sec === SECTIONS.length - 1;
  var msg = isLast ? 'هذا آخر قسم. بعد إنهائه ينتهي الاختبار ولا يمكن تعديل الإجابات.' : 'بعد إنهاء ' + s.title + ' لا يمكنك الرجوع إليه أو تعديل إجاباته.';
  document.getElementById('endTitle').textContent = isLast ? 'إنهاء الاختبار؟' : 'إنهاء القسم؟';
  document.getElementById('endMsg').textContent = msg;
  document.getElementById('endOk').textContent = isLast ? 'إنهاء الاختبار' : 'إنهاء القسم';
  if (dlg && typeof dlg.showModal === 'function') {

    dlg.showModal();

    endSection();

}
if (dlg) dlg.addEventListener('close', function(){ if (dlg.returnValue === 'ok') endSection(); });

function endSection(){
  if (S.sec < SECTIONS.length - 1) { S.sec++; S.screen = 'secIntro'; }
  else { S.finishedAt = Date.now(); S.screen = 'done'; }
  save(); render(); window.scrollTo(0, 0);
}

app.addEventListener('click', function(e){
  var b = e.target.closest('[data-action]');
  if (!b || b.disabled) return;
  var act = b.dataset.action, sec = SECTIONS[S.sec], a;
  switch (act) {
    case 'start':
      S = fresh(); S.startedAt = Date.now(); S.screen = 'secIntro';
      save(); render(); break;
    case 'resume':
      resumePrompt = false; render(); break;
    case 'restart':
      if (window.confirm('سيُحذف كل ما أجبتِ عنه وتبدئين من جديد. هل أنتِ متأكدة؟')) {
        S = fresh(); resumePrompt = false; ui.noteOpen = {}; ui.lastQ = null; save(); render();
      }
      break;
    case 'begin':
      S.cur = sec.from; S.reached[S.sec] = Math.max(S.reached[S.sec], sec.from); S.screen = 'question';
      save(); render(); break;
    case 'choose':
      A(S.cur).c = +b.dataset.i; save(); render();
      refocus('[data-action="choose"][data-i="' + b.dataset.i + '"]'); break;
    case 'conf':
      A(S.cur).f = b.dataset.f; save(); render();
      refocus('[data-action="conf"][data-f="' + b.dataset.f + '"]'); break;
    case 'chip':
      a = A(S.cur);
      var t = b.dataset.t, parts = noteParts(a.note);
      parts = parts.indexOf(t) !== -1 ? parts.filter(function(x){ return x !== t; }) : parts.concat(t);
      a.note = parts.join('، '); ui.noteOpen[S.cur] = true; save(); render();
      refocus('[data-action="chip"][data-t="' + t + '"]'); break;
    case 'go':
      S.cur = +b.dataset.n; save(); render(); break;
    case 'prev':
      if (S.cur > sec.from) { S.cur--; save(); render(); }
      break;
    case 'next':
      if (!complete(S.cur)) return;
      if (S.cur < sec.to) { S.cur++; S.reached[S.sec] = Math.max(S.reached[S.sec], S.cur); save(); render(); }
      else openEnd();
      break;
    case 'share':
      navigator.share({title:'نتيجة اختبار القدرات', text:report()})
        .then(function(){ status('تمت المشاركة.'); })
        .catch(function(err){ if (!err || err.name !== 'AbortError') status('تعذّرت المشاركة. استخدمي زر نسخ النتيجة.'); });
      break;
    case 'copy':
      copyText(report()).then(function(ok){
        status(ok ? 'تم نسخ النتيجة. الصقيها في رسالة وأرسليها.' : 'لم يتم النسخ تلقائياً. افتحي «عرض نص النتيجة» وانسخيه يدوياً.');
      });
      break;
    case 'download':
      var blob = new Blob(['\ufeff' + report()], {type:'text/plain;charset=utf-8'});
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url; link.download = 'qudurat-placement-result.txt';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      status('تم تنزيل ملف النتيجة.');
      break;
  }
});

app.addEventListener('input', function(e){
  if (e.target.id === 'note') { A(S.cur).note = e.target.value; save(); }
});
app.addEventListener('toggle', function(e){
  if (e.target.classList && e.target.classList.contains('note')) ui.noteOpen[S.cur] = e.target.open;
}, true);

/* ---------- Timer: counts only while a question is on screen and the tab is visible ---------- */
var lastTick = Date.now();
setInterval(function(){
  var now = Date.now(), d = now - lastTick;
  lastTick = now;
  if (d > 5000) d = 1000;
  if (inQuestion() && !document.hidden) {
    S.secTime[S.sec] += d;
    S.qTime[S.cur] = (S.qTime[S.cur] || 0) + d;
    var v = document.getElementById('clockVal');
    if (v) v.textContent = fmt(S.secTime[S.sec]);
    var c = document.getElementById('clock');
    if (c) c.classList.toggle('over', S.secTime[S.sec] > SECTIONS[S.sec].suggested * 1000);
    save();
  }
}, 1000);
document.addEventListener('visibilitychange', function(){ lastTick = Date.now(); });

render();
})();
</script>
</body>
