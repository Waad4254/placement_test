<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التدريب الموجّه | القدرات العامة، القسم الكمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#EEF2F0; --surface:#FFFFFF; --ink:#16302B; --muted:#5B6E69; --line:#D3DDD9;
  --accent:#0E6B5A; --accent-ink:#FFFFFF; --accent-soft:#DCEFEA;
  --sure:#0E6B5A; --unsure:#9A5F08; --unsure-soft:#F6EBD6; --guess:#A2414B; --guess-soft:#F5E1E3;
  --backdrop:rgba(10,20,18,.45);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#0F1715; --surface:#16211E; --ink:#E3ECE9; --muted:#9AADA8; --line:#2A3A36;
    --accent:#4CC0A6; --accent-ink:#06231D; --accent-soft:#183A33;
    --sure:#4CC0A6; --unsure:#E3A94A; --unsure-soft:#3A2E17; --guess:#E8848F; --guess-soft:#3B1E22;
    --backdrop:rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,'Geeza Pro',sans-serif;font-size:17px;line-height:1.7}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:.7rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.where{display:flex;flex-direction:column;line-height:1.35}
.where strong{font-weight:600;font-size:1rem}
.where span{color:var(--muted);font-size:.875rem}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;padding:.4rem .2rem;min-height:44px}

main{max-width:760px;margin:0 auto;padding:1.25rem 1.25rem 2rem}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.75rem 1.5rem}
.sheet + .sheet{margin-top:1rem}
h1{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:2rem;line-height:1.45;margin:0 0 .6rem}
h2{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:1.35rem;line-height:1.5;margin:0 0 .6rem}
.lede{font-size:1.1rem;margin:0 0 1rem;max-width:60ch}
p{max-width:62ch}
.muted{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.primary,.ghost{border-radius:999px;padding:.6rem 1.4rem;font-weight:600;cursor:pointer;border:1.5px solid var(--accent);min-height:48px}
.primary{background:var(--accent);color:var(--accent-ink)}
.ghost{background:transparent;color:var(--accent)}
.primary:disabled,.ghost:disabled{opacity:.4;cursor:not-allowed}

/* Home */
.modlist{list-style:none;margin:1.25rem 0 0;padding:0;border-top:1px solid var(--line)}
.modlist li{display:grid;grid-template-columns:2.6rem 1fr auto;gap:1rem;align-items:center;padding:1.1rem 0;border-bottom:1px solid var(--line)}
.modnum{font-family:'Noto Naskh Arabic',serif;font-size:1.9rem;font-weight:700;color:var(--accent);line-height:1;text-align:center}
.modlist h2{font-size:1.2rem;margin:0}
.modlist p{margin:.1rem 0 0;font-size:.92rem}
.modstatus{font-size:.85rem;color:var(--muted);margin-top:.25rem}
.modstatus.done{color:var(--accent);font-weight:600}

/* Module */
.keyq{border-inline-start:4px solid var(--accent);padding:.4rem 1rem;margin:0 0 1.25rem;background:var(--accent-soft);border-radius:0 8px 8px 0;font-weight:500}
.phase{display:flex;justify-content:space-between;gap:1rem;color:var(--muted);font-size:.9rem;margin:0 0 .4rem}
.track{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:0 0 1rem}
.track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.steptext,.qtext{font-family:'Noto Naskh Arabic',serif;font-size:1.28rem;line-height:2;margin:0 0 1.25rem;max-width:62ch}
.steptext:focus,.qtext:focus{outline:none}
.qnum{font-family:'Noto Naskh Arabic',serif;font-size:2.8rem;line-height:1;color:var(--accent);font-weight:700;margin:0 0 .5rem}

.numrow{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:0 0 1rem}
.numrow label{font-weight:600}
.numrow input{width:9rem;font-size:1.25rem;padding:.5rem .8rem;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);text-align:center;font-variant-numeric:tabular-nums}
.numrow input:focus{border-color:var(--accent);outline:none}
.numrow input:disabled{opacity:.7}

.fb{border-radius:10px;padding:.8rem 1rem;margin:0 0 1rem;line-height:1.85}
.fb-ok{background:var(--accent-soft)}
.fb-bad{background:var(--guess-soft)}
.fb-reveal{background:var(--unsure-soft)}
.fb .hintline{display:block;margin-top:.3rem;color:var(--muted)}
.fb .keyline{display:block;margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--line);color:var(--muted)}

.rulebox textarea{width:100%;min-height:6rem;font-size:1.05rem;padding:.7rem .9rem;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);resize:vertical;line-height:1.8}
.rulebox textarea:focus{border-color:var(--accent);outline:none}
.model{border:1.5px dashed var(--accent);border-radius:10px;padding:.8rem 1rem;margin:1rem 0}
.model b{display:block;color:var(--accent);margin-bottom:.2rem}

.choices{display:grid;gap:.6rem;margin:0 0 1.25rem}
.choice{display:grid;grid-template-columns:2.4rem 1fr;align-items:center;gap:.75rem;text-align:start;padding:.55rem .9rem;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;min-height:54px;font-size:1.08rem}
.choice .let{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-weight:600;color:var(--muted)}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.choice.on .let{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice.right{border-color:var(--sure);background:var(--accent-soft)}
.choice.right .let{background:var(--sure);border-color:var(--sure);color:var(--accent-ink)}
.choice.wrong{border-color:var(--guess);background:var(--guess-soft)}
.choice.wrong .let{background:var(--guess);border-color:var(--guess);color:#fff}
.choice:disabled{cursor:default}
.choice.dim{opacity:.55}

.cmp{margin:0 0 1.25rem}
.given{margin:0 0 .75rem;font-size:1.1rem}
.given span{color:var(--muted)}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.cmpgrid div{border:1px dashed var(--line);border-radius:10px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.3rem}
.cmpgrid span{color:var(--muted);font-size:.875rem}
.cmpgrid b{font-family:'Noto Naskh Arabic',serif;font-size:1.35rem;font-weight:600}

.conf{border-top:1px solid var(--line);padding-top:1.1rem;margin:0 0 1rem}
.conf p{margin:0 0 .6rem;font-weight:600}
.cfrow{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.cf{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.45rem;min-height:48px;font-weight:500}
.cf .mk{font-weight:700}
.cf:disabled{cursor:default}
.cf-sure.on{border-color:var(--sure);background:var(--accent-soft);color:var(--sure)}
.cf-unsure.on{border-color:var(--unsure);background:var(--unsure-soft);color:var(--unsure)}
.cf-guess.on{border-color:var(--guess);background:var(--guess-soft);color:var(--guess)}
.keybox{background:var(--unsure-soft);border-radius:10px;padding:.7rem 1rem;margin:0 0 1rem}
.keybox b{color:var(--unsure)}

.stepnav{position:sticky;bottom:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.9rem 0 1rem;margin-top:.5rem}
.stepnav .hint{margin:0;color:var(--muted);font-size:.875rem;text-align:center;flex:1}

.rulelist{list-style:none;padding:0;margin:0 0 1.5rem;display:grid;gap:1rem}
.rulelist li{border-bottom:1px solid var(--line);padding-bottom:1rem}
.rulelist h3{font-size:1rem;margin:0 0 .3rem;color:var(--accent)}
.rulelist .hers{margin:0 0 .4rem}
.rulelist .hers span,.rulelist .ours span{color:var(--muted);font-size:.875rem;display:block}
.rulelist .ours{margin:0}
.score{font-family:'Noto Naskh Arabic',serif;font-size:2.6rem;font-weight:700;color:var(--accent);line-height:1.2;margin:0}
.status{min-height:1.6em;color:var(--accent);font-weight:500;margin:.8rem 0 .4rem}
.raw summary{cursor:pointer;color:var(--muted)}
.raw textarea{width:100%;margin-top:.6rem;font-size:.9rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.7rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:520px){
  body{font-size:16px}
  main{padding:1rem .75rem 1.5rem}
  .sheet{padding:1.25rem 1rem;border-radius:12px}
  .steptext,.qtext{font-size:1.17rem}
  .qnum{font-size:2.3rem}
  .cmpgrid{grid-template-columns:1fr}
  .modlist li{grid-template-columns:2rem 1fr;}
  .modlist li .primary,.modlist li .ghost{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:no-preference){
  .choice,.cf,.track i{transition:background-color .12s,border-color .12s,width .25s}
}
</style>
</head>

/* ---------- State ---------- */
const KEY = 'qudurat-practice-v1';
const store = {
  get(){ try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch(e){ return null; } },
  set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} },
  clear(){ try { localStorage.removeItem(KEY); } catch(e){} }
};
if (/[?&]reset\b/.test(location.search)) {
  store.clear();
  try { history.replaceState(null, '', location.pathname); } catch(e){}
}
function freshMod(){ return {phase:'intro', di:0, pi:0, d:{}, p:{}, discTime:0, updatedAt:null}; }
function fresh(){ const s = {v:1, view:'home', mod:null, mods:{}}; MODULES.forEach(m => s.mods[m.id] = freshMod()); return s; }
let S = store.get();
if (!S || S.v !== 1) S = fresh();
MODULES.forEach(m => { if (!S.mods[m.id]) S.mods[m.id] = freshMod(); });
if (S.view === 'module' && !byId[S.mod]) S.view = 'home';

const app = document.getElementById('app');
const bar = document.getElementById('bar');

function save(){ if (S.view === 'module') S.mods[S.mod].updatedAt = Date.now(); store.set(S); }
function M(){ return byId[S.mod]; }
function ST(){ return S.mods[S.mod]; }
function dS(st, i){ return st.d[i] || (st.d[i] = {attempts:0, solved:false, revealed:false, last:'', tries:[], fb:'', fbType:'', picks:[], text:'', shown:false}); }
function pS(st, i){ return st.p[i] || (st.p[i] = {c:null, f:null, hint:false, checked:false, time:0}); }
function p2(x){ return (x < 10 ? '0' : '') + x; }
function fmt(ms){ const t = Math.round(ms / 1000); return Math.floor(t / 60) + ':' + p2(t % 60); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function stripTags(s){ return String(s).replace(/<br\s*\/?>/g, ' ').replace(/<[^>]+>/g, ''); }

function parseNum(raw){
  let s = String(raw).trim();
  s = s.replace(/[\u0660-\u0669]/g, c => String(c.charCodeAt(0) - 0x0660))
       .replace(/[\u06F0-\u06F9]/g, c => String(c.charCodeAt(0) - 0x06F0))
       .replace(/[\u066B,\u060C]/g, '.')
       .replace(/[\u2212\u2013]/g, '-')
       .replace(/[^0-9.\-\/]/g, '');
  if (!s) return null;
  if (s.indexOf('/') !== -1) {
    const parts = s.split('/'), a = parseFloat(parts[0]), b = parseFloat(parts[1]);
    return (isFinite(a) && isFinite(b) && b !== 0) ? a / b : null;
  }
  const v = parseFloat(s);
  return isFinite(v) ? v : null;
}
function near(a, b){ return Math.abs(a - b) <= 1e-6 * Math.max(1, Math.abs(b)); }
function matchWrong(map, v){
  for (const k in map) { if (near(v, parseFloat(k))) return map[k]; }
  return '';
}

/* ---------- Progress helpers ---------- */
function discDone(st, m){ let n = 0; m.disc.forEach((s, i) => { const d = st.d[i]; if (d && (d.solved || d.revealed || d.shown)) n++; }); return n; }
function pracScore(st, m){ let r = 0, n = 0; m.prac.forEach((q, i) => { const p = st.p[i]; if (p && p.checked) { n++; if (p.c === q.ans) r++; } }); return {r, n}; }
function statusText(m){
  const st = S.mods[m.id];
  if (st.phase === 'intro') return {t:'لم تبدئي بعد', cls:''};
  if (st.phase === 'disc') return {t:'اكتشاف القاعدة: الخطوة ' + (st.di + 1) + ' من ' + m.disc.length, cls:''};
  if (st.phase === 'recap') return {t:'انتهى الاكتشاف، والتدريب لم يبدأ', cls:''};
  if (st.phase === 'prac') return {t:'التدريب: السؤال ' + (st.pi + 1) + ' من ' + m.prac.length, cls:''};
  const s = pracScore(st, m);
  return {t:'مكتملة: ' + s.r + ' من ' + m.prac.length + ' في التدريب', cls:' done'};
}

  if (step.type === 'num') {
    const lock = d.solved || d.revealed;
    h += '<div class="numrow"><label for="numIn">إجابتك:</label>' +
      '<input id="numIn" type="text" inputmode="decimal" dir="ltr" autocomplete="off" value="' + esc(d.last) + '"' + (lock ? ' disabled' : '') + '>' +
      '<button class="primary" data-action="numCheck"' + (lock ? ' disabled' : '') + '>تحقّقي</button></div>';
  } else if (step.type === 'mc') {
    const lock = d.solved || d.revealed;
    h += '<div class="choices" role="group" aria-label="الخيارات">' + step.choices.map((c, k) => {
      let cls = 'choice';
      if (lock && k === step.ans) cls += ' right';
      else if (d.picks.indexOf(k) !== -1) cls += ' wrong';
      else if (lock) cls += ' dim';
      const dis = lock || d.picks.indexOf(k) !== -1;
      return '<button class="' + cls + '" data-action="mcPick" data-i="' + k + '"' + (dis ? ' disabled' : '') + '><span class="let">' + LETTERS[k] + '</span><span>' + c + '</span></button>';
    }).join('') + '</div>';
  } else {
    h += '<div class="rulebox"><label class="sr" for="ruleIn">القاعدة بكلماتك</label>' +
      '<textarea id="ruleIn" placeholder="اكتبي القاعدة هنا بأسلوبك">' + esc(d.text) + '</textarea></div>';
    if (d.shown) h += '<div class="model"><b>صياغة مقترحة للمقارنة</b>' + step.model + '</div>';
    else h += '<div class="actions" style="margin-top:.8rem"><button class="ghost" data-action="ruleShow"' + (d.text.trim().length < 3 ? ' disabled' : '') + '>قارني بصياغة مقترحة</button></div>';
  }
  if (d.fb) h += '<div class="fb fb-' + d.fbType + '" role="status">' + d.fb + '</div>';
  h += '</article>';

  const last = i === m.disc.length - 1;
  const hint = finished ? '' : (step.type === 'rule' ? 'اكتبي القاعدة أولاً، ثم قارنيها' : 'أجيبي للمتابعة');
  h += '<div class="stepnav"><button class="ghost" data-action="dPrev"' + (i === 0 ? ' disabled' : '') + '>السابق</button>' +
    '<p class="hint" aria-live="polite">' + hint + '</p>' +
    '<button class="primary" data-action="dNext"' + (finished ? '' : ' disabled') + '>' + (last ? 'إنهاء الاكتشاف' : 'التالي') + '</button></div>';
  return h;
}

function ruleListHtml(m, st){
  return '<ol class="rulelist">' + m.disc.map((s, i) => {
    if (s.type !== 'rule') return '';
    const d = st.d[i];
    const hers = d && d.text.trim() ? esc(d.text.trim()) : '<span class="muted">لم تُكتب</span>';
    return '<li><h3>' + s.label + '</h3><p class="hers"><span>صياغتك</span>' + hers + '</p><p class="ours"><span>الصياغة المقترحة</span>' + s.model + '</p></li>';
  }).join('') + '</ol>';
}

function renderRecap(m, st){
  return '<section class="sheet"><h1>خلاصة القواعد</h1>' +
    '<p class="lede">هذه القواعد التي اكتشفتِها. اقرئي صياغتك بجانب الصياغة المقترحة، ثم انتقلي إلى التدريب.</p>' +
    ruleListHtml(m, st) +
    '<p class="keyq">قبل كل سؤال تدريب اسألي نفسك: ' + m.key + '</p>' +
    '<div class="actions"><button class="ghost" data-action="backToDisc">مراجعة الخطوات</button><button class="primary" data-action="startPrac">ابدئي التدريب</button></div></section>';
}

function renderPrac(m, st){
  const i = st.pi, q = m.prac[i], p = pS(st, i);
  const opts = q.cmp ? CMP_CHOICES : q.choices;
  let h = '<div class="phase"><span>التدريب</span><span>السؤال ' + (i + 1) + ' من ' + m.prac.length + '</span></div>' +
    '<div class="track" aria-hidden="true"><i style="width:' + Math.round((i + (p.checked ? 1 : 0)) / m.prac.length * 100) + '%"></i></div>' +
    '<article class="sheet q"><div class="qnum" aria-hidden="true">' + (i + 1) + '</div>';
  if (q.cmp) {
    h += '<p class="qtext" id="focus" tabindex="-1">قارني بين القيمة الأولى والقيمة الثانية.</p><div class="cmp">' +
      (q.cmp.given ? '<p class="given"><span>المعطيات: </span>' + q.cmp.given + '</p>' : '') +
      '<div class="cmpgrid"><div><span>القيمة الأولى</span><b>' + q.cmp.a + '</b></div><div><span>القيمة الثانية</span><b>' + q.cmp.b + '</b></div></div></div>';
  } else {
    h += '<p class="qtext" id="focus" tabindex="-1">' + q.text + '</p>';
  }
  h += '<div class="choices" role="radiogroup" aria-label="الخيارات">' + opts.map((c, k) => {
    let cls = 'choice';
    if (p.checked) { if (k === q.ans) cls += ' right'; else if (k === p.c) cls += ' wrong'; else cls += ' dim'; }
    else if (p.c === k) cls += ' on';
    return '<button class="' + cls + '" role="radio" aria-checked="' + (p.c === k) + '" data-action="pChoose" data-i="' + k + '"' + (p.checked ? ' disabled' : '') + '>' +
      '<span class="let">' + LETTERS[k] + '</span><span>' + c + '</span></button>';
  }).join('') + '</div>';
  h += '<div class="conf"><p id="confLbl">كم أنتِ متأكدة من إجابتك؟</p><div class="cfrow" role="radiogroup" aria-labelledby="confLbl">' +
    CONF.map(c => '<button class="cf cf-' + c.id + (p.f === c.id ? ' on' : '') + '" role="radio" aria-checked="' + (p.f === c.id) + '" data-action="pConf" data-f="' + c.id + '"' + (p.checked ? ' disabled' : '') + '>' +
      '<span class="mk" aria-hidden="true">' + c.mark + '</span>' + c.label + '</button>').join('') + '</div></div>';

  if (p.checked) {
    const right = p.c === q.ans;
    let fb = right ? '<b>صحيح.</b> ' + q.exp
      : '<b>الإجابة الصحيحة: (' + LETTERS[q.ans] + ')</b><br>' + (q.wrongs && q.wrongs[p.c] ? q.wrongs[p.c] + '<br>' : '') + q.exp;
    fb += '<span class="keyline">السؤال الذي يفتح الحل: ' + q.key + '</span>';
    h += '<div class="fb fb-' + (right ? 'ok' : 'bad') + '" role="status">' + fb + '</div>';
  } else if (p.hint) {
    h += '<div class="keybox" role="status"><b>تلميح: </b>' + q.key + '</div>';
  } else {
    h += '<div class="actions" style="margin-bottom:1rem"><button class="ghost" data-action="pHint">أحتاج تلميحاً</button></div>';
  }
  h += '</article>';

  const ready = p.c !== null && p.f !== null;
  const last = i === m.prac.length - 1;
  h += '<div class="stepnav"><span></span><p class="hint" aria-live="polite">' + (p.checked || ready ? '' : 'اختاري إجابة ومدى ثقتك') + '</p>' +
    (p.checked ? '<button class="primary" data-action="pNext">' + (last ? 'إنهاء الوحدة' : 'السؤال التالي') + '</button>'
               : '<button class="primary" data-action="pCheck"' + (ready ? '' : ' disabled') + '>تحقّقي من إجابتك</button>') + '</div>';
  return h;
}

function renderDone(m, st){
  const s = pracScore(st, m);
  const next = MODULES[m.idx + 1];
  return '<section class="sheet"><h1>أنهيتِ وحدة ' + m.title + '</h1>' +
    '<p class="score">' + s.r + ' من ' + m.prac.length + '</p><p class="muted">في أسئلة التدريب</p>' +
    '<p>أرسلي تقرير الوحدة لمن يساعدك في المذاكرة.</p>' + reportActions('mod') + '</section>' +
    '<section class="sheet"><h2>خلاصة القواعد</h2>' + ruleListHtml(m, st) +
    '<div class="actions">' + (next ? '<button class="primary" data-action="open" data-m="' + next.id + '">الوحدة التالية: ' + next.title + '</button>' : '') +
    '<button class="ghost" data-action="home">كل الوحدات</button><button class="ghost" data-action="restartMod">إعادة الوحدة</button></div></section>';
}

function reportActions(scope){
  const canShare = typeof navigator.share === 'function';
  return '<div class="actions">' +
    (canShare ? '<button class="primary" data-action="share" data-scope="' + scope + '">إرسال التقرير</button>' : '') +
    '<button class="' + (canShare ? 'ghost' : 'primary') + '" data-action="copy" data-scope="' + scope + '">نسخ التقرير</button>' +
    '<button class="ghost" data-action="download" data-scope="' + scope + '">تنزيل ملف التقرير</button></div>' +
    '<p class="status" id="status" aria-live="polite"></p>' +
    '<details class="raw"><summary>عرض نص التقرير</summary><textarea readonly rows="10">' + esc(scope === 'all' ? reportAll() : modReport(M()).join('\n')) + '</textarea></details>';
}

function render(){
  renderBar();
  let html, key;
  if (S.view === 'home') { html = renderHome(); key = 'home'; }
  else {
    const m = M(), st = ST();
    if (st.phase === 'intro') html = renderIntro(m);
    else if (st.phase === 'disc') html = renderDisc(m, st);
    else if (st.phase === 'recap') html = renderRecap(m, st);
    else if (st.phase === 'prac') html = renderPrac(m, st);
    else html = renderDone(m, st);
    key = m.id + ':' + st.phase + ':' + (st.phase === 'disc' ? st.di : st.phase === 'prac' ? st.pi : '');
  }
  app.innerHTML = html;
  if (key !== ui.lastKey) {
    ui.lastKey = key;
    window.scrollTo(0, 0);
    const f = document.getElementById('focus');
    if (f) f.focus({preventScroll:true});
  }
}
function refocus(sel){ const el = app.querySelector(sel); if (el) el.focus(); }

/* ---------- Reports ---------- */
function stamp(t){ const d = new Date(t || Date.now()); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }

function modReport(m){
  const st = S.mods[m.id], L = [];
  L.push('الوحدة ' + (m.idx + 1) + ': ' + m.title);
  if (st.phase === 'intro') { L.push('لم تبدأ بعد.'); return L; }
  L.push('آخر نشاط: ' + stamp(st.updatedAt));
  L.push('الاكتشاف: ' + discDone(st, m) + ' من ' + m.disc.length + ' خطوات، الوقت ' + fmt(st.discTime));
  const hard = [];
  m.disc.forEach((s, i) => {
    const d = st.d[i];
    if (!d || s.type === 'rule' || d.attempts === 0) return;
    const tried = s.type === 'num' ? d.tries.join('، ') : d.picks.map(k => s.choices[k]).join('، ');
    hard.push('  - ' + s.label + ': ' + (d.revealed ? 'ظهرت الإجابة بعد محاولتين' : 'صحّت في المحاولة الثانية') + (tried ? ' (أدخلت: ' + tried + ')' : ''));
  });
  L.push('- خطوات احتاجت أكثر من محاولة: ' + (hard.length ? '' : 'لا يوجد'));
  hard.forEach(x => L.push(x));
  L.push('- صياغتها للقواعد:');
  m.disc.forEach((s, i) => {
    if (s.type !== 'rule') return;
    const d = st.d[i];
    L.push('  - ' + s.label + ': ' + (d && d.text.trim() ? '«' + d.text.trim().replace(/\s+/g, ' ') + '»' : 'لم تكتب بعد'));
  });
  if (st.phase === 'prac' || st.phase === 'done') {
    const sc = pracScore(st, m);
    let t = 0; const wrongSure = [], hints = [];
    m.prac.forEach((q, i) => { const p = st.p[i]; if (!p) return; t += p.time; if (p.checked && p.c !== q.ans && p.f === 'sure') wrongSure.push('ت' + (i + 1)); if (p.hint) hints.push('ت' + (i + 1)); });
    L.push('التدريب: ' + sc.r + ' صحيحة من ' + sc.n + ' مُجابة (من أصل ' + m.prac.length + ')، الوقت ' + fmt(t));
    L.push('- خاطئة مع ثقة: ' + (wrongSure.join('، ') || 'لا يوجد'));
    L.push('- استخدمت التلميح في: ' + (hints.join('، ') || 'لا شيء'));
    m.prac.forEach((q, i) => {
      const p = st.p[i];
      if (!p || !p.checked) return;
      const r = p.c === q.ans;
      const cf = (CONF.find(c => c.id === p.f) || {label:''}).label;
      L.push('  ت' + (i + 1) + ' | ' + (r ? 'صحيحة' : 'خاطئة: اختارت ' + LETTERS[p.c] + ' والصحيح ' + LETTERS[q.ans]) + ' | ' + cf + ' | ' + fmt(p.time) + (p.hint ? ' | بتلميح' : ''));
      if (!r && q.wrongs && q.wrongs[p.c]) L.push('     خطأ محتمل: ' + stripTags(q.wrongs[p.c]));
    });
  }
  return L;
}
function reportAll(){
  const L = ['تقرير التدريب الموجّه: القدرات العامة، القسم الكمي', 'تاريخ التقرير: ' + stamp(), ''];
  MODULES.forEach(m => { L.push.apply(L, modReport(m)); L.push(''); });
  return L.join('\n').trim();
}
function reportText(scope){
  if (scope === 'all') return reportAll();
  return ['تقرير التدريب الموجّه: القدرات العامة، القسم الكمي', ''].concat(modReport(M())).join('\n');
}

function status(msg){ const el = document.getElementById('status'); if (el) el.textContent = msg; }
function legacyCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch(e){}
  ta.remove(); return ok;
}
function copyText(text){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(() => true, () => legacyCopy(text));
  return Promise.resolve(legacyCopy(text));
}

/* ---------- Actions ---------- */
function checkNum(){
  const m = M(), st = ST(), step = m.disc[st.di], d = dS(st, st.di);
  const input = document.getElementById('numIn');
  if (!input) return;
  d.last = input.value;
  const v = parseNum(input.value);
  if (v === null) { d.fb = 'اكتبي إجابتك رقماً.'; d.fbType = 'bad'; save(); render(); refocus('#numIn'); return; }
  if (near(v, step.ans)) {
    d.solved = true; d.fb = '<b>صحيح.</b> ' + step.ok; d.fbType = 'ok';
    save(); render(); refocus('[data-action="dNext"]'); return;
  }
  d.attempts++; d.tries.push(input.value.trim());
  const specific = matchWrong(step.wrong || {}, v);
  if (d.attempts >= 2) {
    d.revealed = true; d.fbType = 'reveal';
    d.fb = (specific ? specific + '<br>' : '') + '<b>الإجابة: ' + step.ans + '</b><br>' + step.ok;
    save(); render(); refocus('[data-action="dNext"]');
  } else {
    d.fbType = 'bad';
    d.fb = (specific || 'ليس بعد. حاولي مرة أخرى.') + (step.hint ? '<span class="hintline">فكرة تساعدك: ' + step.hint + '</span>' : '');
    save(); render(); refocus('#numIn');
  }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b || b.disabled) return;
  const act = b.dataset.action;
  let st, m, d, p, q;
  switch (act) {
    case 'home': S.view = 'home'; save(); render(); break;
    case 'open': S.view = 'module'; S.mod = b.dataset.m; save(); render(); break;
    case 'startDisc': st = ST(); st.phase = 'disc'; st.di = 0; save(); render(); break;
    case 'numCheck': checkNum(); break;
    case 'mcPick': {
      m = M(); st = ST(); const step = m.disc[st.di]; d = dS(st, st.di);
      const k = +b.dataset.i;
      if (k === step.ans) { d.solved = true; d.fb = '<b>صحيح.</b> ' + step.ok; d.fbType = 'ok'; save(); render(); refocus('[data-action="dNext"]'); }
      else {
        d.attempts++; d.picks.push(k);
        if (d.attempts >= 2) {
          d.revealed = true; d.fbType = 'reveal';
          d.fb = (step.wrongs[k] ? step.wrongs[k] + '<br>' : '') + '<b>الإجابة: ' + step.choices[step.ans] + '</b><br>' + step.ok;
          save(); render(); refocus('[data-action="dNext"]');
        } else {
          d.fbType = 'bad'; d.fb = (step.wrongs[k] || 'ليس هذا.') + ' حاولي مرة أخرى.';
          save(); render(); refocus('.choice:not(:disabled)');
        }
      }
      break;
    }
    case 'ruleShow': st = ST(); d = dS(st, st.di); d.shown = true; save(); render(); refocus('[data-action="dNext"]'); break;
    case 'dPrev': st = ST(); if (st.di > 0) { st.di--; save(); render(); } break;
    case 'dNext': m = M(); st = ST(); if (st.di < m.disc.length - 1) st.di++; else st.phase = 'recap'; save(); render(); break;
    case 'backToDisc': st = ST(); st.phase = 'disc'; st.di = 0; save(); render(); break;
    case 'startPrac': st = ST(); st.phase = 'prac'; st.pi = 0; save(); render(); break;
    case 'pChoose': st = ST(); pS(st, st.pi).c = +b.dataset.i; save(); render(); refocus('[data-action="pChoose"][data-i="' + b.dataset.i + '"]'); break;
    case 'pConf': st = ST(); pS(st, st.pi).f = b.dataset.f; save(); render(); refocus('[data-action="pConf"][data-f="' + b.dataset.f + '"]'); break;
    case 'pHint': st = ST(); pS(st, st.pi).hint = true; save(); render(); break;
    case 'pCheck': st = ST(); p = pS(st, st.pi); if (p.c === null || p.f === null) return; p.checked = true; save(); render(); refocus('[data-action="pNext"]'); break;
    case 'pNext': m = M(); st = ST(); if (st.pi < m.prac.length - 1) st.pi++; else st.phase = 'done'; save(); render(); break;
    case 'restartMod':
      if (window.confirm('ستُحذف إجاباتك في هذه الوحدة وتبدئينها من جديد. هل أنتِ متأكدة؟')) { S.mods[S.mod] = freshMod(); ui.lastKey = null; save(); render(); }
      break;
    case 'share':
      navigator.share({title:'تقرير التدريب الموجّه', text:reportText(b.dataset.scope)})
        .then(() => status('تمت المشاركة.'))
        .catch(err => { if (!err || err.name !== 'AbortError') status('تعذّرت المشاركة. استخدمي زر نسخ التقرير.'); });
      break;
    case 'copy':
      copyText(reportText(b.dataset.scope)).then(ok => status(ok ? 'تم نسخ التقرير. الصقيه في رسالة وأرسليه.' : 'لم يتم النسخ تلقائياً. افتحي «عرض نص التقرير» وانسخيه يدوياً.'));
      break;
    case 'download': {
      const blob = new Blob(['\ufeff' + reportText(b.dataset.scope)], {type:'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = b.dataset.scope === 'all' ? 'qudurat-practice-all.txt' : 'qudurat-practice-' + S.mod + '.txt';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      status('تم تنزيل ملف التقرير.');
      break;
    }
  }
});

app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'numIn') { e.preventDefault(); checkNum(); }
});
app.addEventListener('input', e => {
  if (e.target.id === 'ruleIn') {
    const st = ST(), d = dS(st, st.di);
    d.text = e.target.value; save();
    const btn = app.querySelector('[data-action="ruleShow"]');
    if (btn) btn.disabled = d.text.trim().length < 3;
  }
});

/* ---------- Time: counts only while a step or an unanswered practice question is on screen ---------- */
let lastTick = Date.now();
setInterval(() => {
  const now = Date.now(); let dt = now - lastTick; lastTick = now;
  if (dt > 5000) dt = 1000;
  if (S.view !== 'module' || document.hidden) return;
  const st = ST();
  if (st.phase === 'disc') { st.discTime += dt; store.set(S); }
  else if (st.phase === 'prac') { const p = pS(st, st.pi); if (!p.checked) { p.time += dt; store.set(S); } }
}, 1000);
document.addEventListener('visibilitychange', () => { lastTick = Date.now(); });

render();
})();
</script>
</body>
</html>
